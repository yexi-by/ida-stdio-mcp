name: ida-e2e

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ida:
    runs-on: [self-hosted, windows, x64, ida-pro-9_3]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Configure external runtime paths
        shell: pwsh
        run: |
          @(
            "UV_PROJECT_ENVIRONMENT=$env:RUNNER_TEMP\ida-re-mcp-venv"
            "RUFF_CACHE_DIR=$env:RUNNER_TEMP\ida-re-mcp-ruff-cache"
            "HYPOTHESIS_STORAGE_DIRECTORY=$env:RUNNER_TEMP\ida-re-mcp-hypothesis"
            "PYTHONPYCACHEPREFIX=$env:RUNNER_TEMP\ida-re-mcp-pycache"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Require licensed IDA environment
        shell: pwsh
        run: |
          if (-not $env:IDADIR) {
            throw "self-hosted runner 必须设置 IDADIR"
          }
          if (-not (Test-Path -LiteralPath $env:IDADIR -PathType Container)) {
            throw "IDADIR 不是可访问目录"
          }
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Validate lock and environment
        run: |
          uv lock --check
          uv sync --locked
          uv run --locked python -c "import sys; assert sys.version_info[:2] == (3, 13)"
      - name: Require LLVM and LLD 22.1.8
        shell: pwsh
        run: |
          $clangVersion = & clang --version | Select-Object -First 1
          $lldVersion = & lld-link --version | Select-Object -First 1
          if ($clangVersion -notmatch "22\.1\.8" -or $lldVersion -notmatch "22\.1\.8") {
            throw "self-hosted runner 必须提供 LLVM/LLD 22.1.8"
          }
      - name: Build deterministic fixtures
        run: ./scripts/build_fixtures.ps1
      - name: Probe IDA headless worker
        run: uv run --locked python -m ida_re_mcp.worker probe
      - name: IDA static and mutation E2E
        run: >-
          uv run --locked pytest -q tests/ida -m "ida and not debugger"
          -o "cache_dir=$env:RUNNER_TEMP\ida-re-mcp-pytest-cache"
      - name: Windows x64 debugger E2E
        run: >-
          uv run --locked pytest -q tests/ida -m debugger
          -o "cache_dir=$env:RUNNER_TEMP\ida-re-mcp-pytest-cache"
