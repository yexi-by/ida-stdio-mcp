[logging]
level = "INFO"
directory = "logs"

[server]
protocol_version = "2025-06-18"
server_name = "ida-stdio-mcp"
default_input_path = ""
isolated_contexts = false

[runtime_workspace]
directory = ".runtime"
symbol_cache_directory = ".runtime/symbol-cache"

[ida_runtime]
install_dir = ""

[open_target]
loader = ""
processor = ""
plugin_options = []

[debugger]
backend_candidates = []
wait_for_suspend_ms = 1500
launch_use_request_default = true
remote_enabled = false

[hexrays]
enable_experimental_microcode = false

[managed_decompiler]
enabled = true
command = ""
timeout_sec = 30

[limits]
default_page_size = 100
max_page_size = 1000
max_search_hits = 1000
max_callgraph_depth = 4

[external_analyzers]
